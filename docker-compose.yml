services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker.io/ambro333/rag-api:latest
    container_name: rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - RAG_SECRET_KEY=${RAG_SECRET_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-true}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-RAG PROJECT}
    security_opt:
      - label=disable
    volumes:
      - ./data:/app/data:Z
      - ./knowledge_base:/app/knowledge_base:Z
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --workers 2
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    image: docker.io/ambro333/rag-frontend:latest
    container_name: rag-frontend
    ports:
      - "8501:3000"
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    security_opt:
      - label=disable
    depends_on:
      - fastapi
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: rag-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - fastapi
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: rag-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro,Z
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro,Z
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
    depends_on:
      - prometheus
    restart: unless-stopped
