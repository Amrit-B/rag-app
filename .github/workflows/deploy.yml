name: CI/CD

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - "DEPLOYMENT.md"
      - "*.md"
      - ".gitignore"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ambro333/rag-api:latest
            ambro333/rag-app:latest
          platforms: linux/amd64,linux/arm64

      - name: Build and push Frontend Next.js image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/web
          file: ./frontend/web/Dockerfile
          push: true
          tags: ambro333/rag-frontend:latest
          platforms: linux/amd64,linux/arm64

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.VM_APP_PATH }}
            
            sudo fuser -k 8000/tcp || true
            sudo fuser -k 8501/tcp || true
            sudo fuser -k 3000/tcp || true
            
            if command -v podman >/dev/null 2>&1; then
              sudo podman system prune -a --force 2>&1 || true
              sudo podman pull docker.io/ambro333/rag-api:latest
              sudo podman pull docker.io/ambro333/rag-frontend:latest
              sudo /usr/local/bin/podman-compose pull || true
              sudo /usr/local/bin/podman-compose down || true
              sudo /usr/local/bin/podman-compose up -d --remove-orphans
            elif command -v docker >/dev/null 2>&1; then
              docker system prune -a --force 2>&1 || true
              docker pull ambro333/rag-api:latest
              docker pull ambro333/rag-frontend:latest
              if docker compose version >/dev/null 2>&1; then
                docker compose down || true
                docker compose pull || true
                docker compose up -d --remove-orphans
              else
                docker-compose down || true
                docker-compose pull || true
                docker-compose up -d --remove-orphans
              fi
            fi
            
            sudo systemctl restart nginx